name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - README.md
      - agent/**
      - apps/desktop/**
      - packaging/windows/**
      - pyproject.toml

permissions:
  contents: write

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.10,<7"
          npm ci --prefix apps/desktop
      - name: Verify runner SQLite
        run: python packaging/windows/verify_sqlite.py --source
      - name: Python tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: agent
      - name: Build Python programs
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name bluely-agent --paths agent --hidden-import _sqlite3 --collect-data blueguard --collect-submodules keyring.backends packaging/windows/agent_entry.py
          python -m PyInstaller --noconfirm --clean --onedir --console --name bluely-native-host --paths agent --hidden-import _sqlite3 --collect-data blueguard --collect-submodules keyring.backends packaging/windows/native_host_entry.py
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name bluely-defender-broker --paths agent --collect-data blueguard packaging/windows/broker_entry.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name bluely-agent-onefile --paths agent --hidden-import _sqlite3 --collect-data blueguard --collect-submodules keyring.backends packaging/windows/agent_entry.py
      - name: Verify frozen SQLite and native libraries
        run: python packaging/windows/verify_sqlite.py --agent-folder dist/bluely-agent --native-host-folder dist/bluely-native-host --onefile dist/bluely-agent-onefile.exe
      - name: Smoke test packaged agent and browser host
        run: python packaging/windows/smoke.py dist
      - name: Stage Windows runtime for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/windows-runtime/agent | Out-Null
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/windows-runtime/native-host | Out-Null
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/windows-runtime/broker | Out-Null
          Copy-Item dist/bluely-agent/* apps/desktop/src-tauri/windows-runtime/agent -Recurse -Force
          Copy-Item dist/bluely-native-host/* apps/desktop/src-tauri/windows-runtime/native-host -Recurse -Force
          Copy-Item dist/bluely-defender-broker/* apps/desktop/src-tauri/windows-runtime/broker -Recurse -Force
      - name: Build installer
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.windows.conf.json
      - name: Verify agent inside NSIS setup
        shell: pwsh
        run: |
          $bundle = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $bundle) { throw 'NSIS installer was not produced' }
          $extract = Join-Path $env:RUNNER_TEMP 'bluely-nsis-payload'
          New-Item -ItemType Directory -Force $extract | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip l $bundle.FullName | Select-String 'bluely-agent|native-host|_sqlite3|sqlite3.dll' | Select-Object -First 40
          & $sevenZip x $bundle.FullName "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract NSIS setup payload' }
          $agentFolder = Join-Path $extract 'agent'
          $nativeHostFolder = Join-Path $extract 'native-host'
          if (-not (Test-Path (Join-Path $agentFolder 'bluely-agent.exe')) -or
              -not (Test-Path (Join-Path $nativeHostFolder 'bluely-native-host.exe'))) {
            Get-ChildItem $extract -File -Recurse | Where-Object { $_.Name -match 'bluely-agent|native-host|_sqlite3|sqlite3.dll' } | Select-Object -First 40 -ExpandProperty FullName
            throw 'NSIS setup resource paths differ from the expected agent/native-host layout'
          }
          python packaging/windows/verify_sqlite.py --agent-folder $agentFolder --native-host-folder $nativeHostFolder
          python packaging/windows/smoke.py $extract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bluely-Windows-x64-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
      - name: Publish curl-installable Windows release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $bundle) { throw 'NSIS installer was not produced' }
          $installer = 'Bluely-Setup-x64.exe'
          Copy-Item $bundle.FullName $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('Bluely-Setup-x64.exe.sha256', "$hash  $installer`n")
          $tag = "windows-$($env:GITHUB_SHA.Substring(0, 12))"
          gh release create $tag $installer 'Bluely-Setup-x64.exe.sha256' --target $env:GITHUB_SHA --latest --title "Bluely Windows $($env:GITHUB_SHA.Substring(0, 12))" --notes 'Unsigned Windows 10/11 x64 installer. Review the setup instructions in README.md.'
